name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic suite
        run: env PYTHONPATH=. pytest -q
      - name: Run synthetic execution demo
        run: env PYTHONPATH=. python scripts/demo_event_driven_execution.py
      - name: Verify frozen artifacts
        run: env PYTHONPATH=. python scripts/verify_v2_artifacts.py
