name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic suite
        run: env PYTHONPATH=. pytest -q
      - name: Run synthetic execution demo
        run: env PYTHONPATH=. python scripts/demo_event_driven_execution.py
      - name: Verify frozen artifacts
        run: env PYTHONPATH=. python scripts/verify_v2_artifacts.py
