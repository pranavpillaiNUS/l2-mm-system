name: Report

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/report.yml"
      - ".gitattributes"
      - ".gitignore"
      - "DATA.md"
      - "Makefile"
      - "README.md"
      - "notebooks/README.md"
      - "requirements.txt"
      - "report/**"
      - "results/README.md"
      - "results/panels/btcusdt_l2_panel_v2/**"
      - "results/replay_correctness/snapshot_timing_panel24.json"
      - "scripts/audit_snapshot_timing.py"
      - "scripts/build_report_assets.py"
      - "scripts/check_report.py"
      - "scripts/verify_v2_artifacts.py"
      - "src/recorder/simple_recorder.py"
      - "src/replay/depth_parser.py"
  pull_request:
    paths:
      - ".github/workflows/report.yml"
      - ".gitattributes"
      - ".gitignore"
      - "DATA.md"
      - "Makefile"
      - "README.md"
      - "notebooks/README.md"
      - "requirements.txt"
      - "report/**"
      - "results/README.md"
      - "results/panels/btcusdt_l2_panel_v2/**"
      - "results/replay_correctness/snapshot_timing_panel24.json"
      - "scripts/audit_snapshot_timing.py"
      - "scripts/build_report_assets.py"
      - "scripts/check_report.py"
      - "scripts/verify_v2_artifacts.py"
      - "src/recorder/simple_recorder.py"
      - "src/replay/depth_parser.py"

jobs:
  validate-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
      - uses: WtfJoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4
        with:
          tectonic-version: "0.17.0"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils qpdf
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild and validate report
        run: make report-check PYTHON=python
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l2-mm-technical-report
          path: report/l2_mm_research_report.pdf
